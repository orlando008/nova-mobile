<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080c">
  <meta name="description" content="NOVA Mobile is a browser game platform for phones and tablets. Browse the Library for touch-first games.">
  <title>Library | NOVA Mobile</title>
  <link rel="icon" href="./site-assets/favicon.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="./" aria-label="NOVA Mobile home">
        <img src="./site-assets/phone-mark.png" width="38" height="38" alt="">
        NOVA MOBILE
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="./" aria-current="page">Library</a>
        <a href="./about/">About</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1" class="shell page-content">
    <section class="hero library-hero" aria-labelledby="welcome">
      <div class="hero-copy">
        <h1 id="welcome">Games built<br><span>for touch.</span></h1>
        <p>A browser game platform for phones and tablets.</p>
      </div>
      <div class="hero-art">
        <div class="art-frame" aria-hidden="true"></div>
        <img class="bit" src="./site-assets/bit.webp" width="540" height="660" alt="Bit, NOVA Mobile’s robot mascot, waving hello">
      </div>
    </section>

    <section class="catalog" aria-labelledby="library">
      <h2 id="library">Library</h2>
      <div class="empty-state">
        <div class="catalog-icon" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <div>
          <h3>No games published yet</h3>
          <p>New games will appear here as they’re published.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>Part of the NOVA family</span>
      <a href="https://orlando008.github.io/fanstasy-console/">NOVA-16 <span aria-hidden="true">↗</span></a>
    </div>
  </footer>
</body>
</html>
