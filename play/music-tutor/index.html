<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c32">
  <meta name="description" content="Hear a note, read the treble staff, and choose its name. Practice naturals, sharps, and flats.">
  <meta property="og:title" content="Music Tutor">
  <meta property="og:description" content="Hear a note, read the treble staff, and choose its name. Practice naturals, sharps, and flats.">
  <meta property="og:image" content="../../carts/music-tutor/assets/poster.png">
  <title>Music Tutor</title>
  <link rel="icon" href="../../carts/music-tutor/assets/icon.png" sizes="512x512" type="image/png">
  <link rel="stylesheet" href="./music-tutor.css?v=note-explorer">
</head>
<body>
  <main class="folio">
    <header class="topbar">
      <a class="utility" href="../../">‹ Library</a>
      <button type="button" class="utility" id="mute" aria-pressed="false">Mute sound</button>
    </header>

    <div class="sheet">
      <header class="masthead">
        <h1>Music Tutor</h1>
        <div class="ornament" aria-hidden="true">❦</div>
      </header>

      <section id="menu" class="menu" aria-labelledby="menu-title">
        <div class="player-progress">
          <div><strong id="player-rank"></strong><span id="player-xp"></span></div>
          <progress id="player-meter" aria-label="Experience toward next level"></progress>
          <small id="next-rank"></small>
        </div>
        <fieldset class="mode-options">
          <legend>Answer mode</legend>
          <label>
            <input type="radio" name="mode" value="letters" checked>
            <span>Letters</span>
          </label>
          <label>
            <input type="radio" name="mode" value="keyboard">
            <span>Keyboard</span>
          </label>
        </fieldset>
        <h2 id="menu-title" tabindex="-1">Choose a difficulty</h2>
        <fieldset aria-labelledby="menu-title">
          <label>
            <input type="radio" name="difficulty" value="natural" checked>
            <span>Natural notes <small>A through G</small></span>
          </label>
          <label>
            <input type="radio" name="difficulty" value="sharps">
            <span>Sharps <small>Natural notes and ♯</small></span>
          </label>
          <label>
            <input type="radio" name="difficulty" value="mixed">
            <span>Sharps &amp; flats <small>Natural notes, ♯ and ♭</small></span>
          </label>
          <label>
            <input type="radio" name="difficulty" value="key">
            <span>Key signatures <small>Read the key and any note accidentals</small></span>
          </label>
        </fieldset>
        <button type="button" class="primary" id="start">Start practice</button>
        <button type="button" class="secondary" id="open-explorer">Note Explorer</button>
        <button type="button" class="primary studio-entry" id="menu-studio">Piano Studio</button>
      </section>

      <section id="lesson" aria-label="Note practice" hidden>
        <div class="lesson-heading">
          <p id="level"></p>
          <p id="progress"></p>
        </div>
        <button type="button" id="staff" class="staff-button" aria-label="Replay the note">
          <span class="staff" aria-hidden="true">
            <span class="staff-line"></span>
            <span class="staff-line"></span>
            <span class="staff-line"></span>
            <span class="staff-line"></span>
            <span class="staff-line"></span>
            <img class="clef" src="../../carts/music-tutor/assets/treble-clef.png" alt="">
            <span id="key-signature"></span>
            <span id="ledger-line" class="staff-ledger" hidden></span>
            <span id="accidental" class="accidental"></span>
            <span class="notation">
              <span class="stem"></span>
              <span class="notehead"></span>
            </span>
          </span>
          <span class="replay-label"><span aria-hidden="true">♪</span> Tap the note to replay</span>
        </button>

        <div id="letter-answers" class="answers" role="group" aria-label="Name the note">
          <button type="button" class="choice" aria-keyshortcuts="1"></button>
          <button type="button" class="choice" aria-keyshortcuts="2"></button>
          <button type="button" class="choice" aria-keyshortcuts="3"></button>
        </div>
        <div id="keyboard-answers" class="piano" role="group" aria-label="Play the note on the piano keyboard" hidden></div>

        <p id="feedback" class="feedback" role="status"></p>
        <button type="button" class="primary" id="next" hidden>Next note</button>
        <button type="button" id="change-level" class="secondary">Change mode or difficulty</button>
      </section>

      <section id="results" class="results" aria-labelledby="results-title" hidden>
        <h2 id="results-title" tabindex="-1">Practice complete</h2>
        <p id="final-score" class="final-score"></p>
        <p id="final-level"></p>
        <p id="lesson-xp"></p>
        <p id="level-reward" class="level-reward" hidden></p>
        <button type="button" class="primary" id="again">Practice again</button>
        <button type="button" class="primary studio-entry" id="results-studio">Piano Studio</button>
        <button type="button" id="results-menu" class="secondary">Change mode or difficulty</button>
      </section>

      <section id="explorer" class="explorer" aria-labelledby="explorer-title" hidden>
        <h2 id="explorer-title" tabindex="-1">Note Explorer</h2>
        <p id="explorer-help">Tap a line or space to hear its note.</p>
        <div class="explorer-board">
          <div id="explorer-staff" class="staff" role="group" aria-label="Treble staff" aria-describedby="explorer-help">
            <span class="staff-line" aria-hidden="true"></span>
            <span class="staff-line" aria-hidden="true"></span>
            <span class="staff-line" aria-hidden="true"></span>
            <span class="staff-line" aria-hidden="true"></span>
            <span class="staff-line" aria-hidden="true"></span>
            <img class="clef" src="../../carts/music-tutor/assets/treble-clef.png" alt="">
            <span class="staff-ledger" aria-hidden="true" hidden></span>
            <span class="notation" aria-hidden="true" hidden>
              <span class="stem"></span>
              <span class="notehead"></span>
            </span>
            <span class="explorer-letter" aria-hidden="true" hidden></span>
          </div>
        </div>
        <button type="button" class="secondary" id="explorer-back">Back to practice</button>
      </section>

      <section id="studio" class="studio" aria-labelledby="studio-title" hidden>
        <h2 id="studio-title" tabindex="-1">Piano Studio</h2>
        <div id="studio-room" class="studio-room" role="img" aria-label="Piano studio">
          <img class="studio-backdrop" src="../../carts/music-tutor/assets/studio/room.webp" width="900" height="600" alt="" loading="lazy">
          <img class="room-item wall" alt="" loading="lazy" hidden>
          <img class="room-item rug" alt="" loading="lazy" hidden>
          <img class="room-item piano-furniture" alt="" loading="lazy" hidden>
          <img class="room-item plant" alt="" loading="lazy" hidden>
        </div>
        <div class="studio-heading">
          <h3>Pianos</h3>
          <strong id="studio-points"></strong>
        </div>
        <p class="studio-hint">Earn one studio point each time you level up.</p>
        <ul id="piano-items" class="studio-items" aria-label="Pianos"></ul>
        <div class="studio-heading"><h3>Decorations</h3></div>
        <ul id="studio-items" class="studio-items studio-decorations" aria-label="Decorations"></ul>
        <p id="studio-status" class="studio-status" role="status"></p>
        <button type="button" class="secondary" id="studio-back">Back to practice</button>
      </section>
      <p class="save-notice" id="save-notice" role="status" hidden>Progress could not be saved on this device.</p>
    </div>
  </main>
  <script type="module" src="./music-tutor.mjs?v=note-explorer"></script>
</body>
</html>
