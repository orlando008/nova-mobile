<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff4f9">
  <meta name="description" content="Explore the world with quizzes on country locations, flags, and capitals.">
  <meta property="og:title" content="Global Citizen">
  <meta property="og:description" content="Explore the world with quizzes on country locations, flags, and capitals.">
  <meta property="og:image" content="../../carts/global-citizen/assets/poster.png">
  <title>Global Citizen</title>
  <link rel="icon" href="../../carts/global-citizen/assets/icon.png">
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
  <div class="atlas">
    <header class="topbar">
      <a class="library" href="../../">‹ Library</a>
      <button class="back" type="button" id="menu-button" hidden>‹ Quiz menu</button>
    </header>
    <main>
      <section id="menu" aria-labelledby="title">
        <div class="hero">
          <h1 id="title" tabindex="-1">Global<br>Citizen</h1>
        </div>
        <div class="menu-content">
          <label class="region">Region
            <select id="region">
              <option>World</option>
              <option>Africa</option>
              <option>Asia</option>
              <option>Europe</option>
              <option>North America</option>
              <option>South America</option>
              <option>Oceania</option>
            </select>
          </label>
          <div class="mode-list" aria-label="Quiz modes">
            <button class="mode" type="button" data-mode="countries">
              <span class="mode-icon location" aria-hidden="true">⌖</span>
              <span><strong>Countries</strong><small>Find countries on the map</small></span>
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <button class="mode" type="button" data-mode="flags">
              <span class="mode-icon flag" aria-hidden="true">⚑</span>
              <span><strong>Flags</strong><small>Match flags to countries</small></span>
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <button class="mode" type="button" data-mode="capitals">
              <span class="mode-icon capital" aria-hidden="true">★</span>
              <span><strong>Capitals</strong><small>Pick the capital city</small></span>
              <span class="chevron" aria-hidden="true">›</span>
            </button>
          </div>
        </div>
      </section>
      <section id="quiz" class="panel" aria-labelledby="mode-title" hidden>
        <div class="quiz-header">
          <h1 id="mode-title"></h1>
          <span id="quiz-region"></span>
        </div>
        <div class="round-progress">
          <progress id="progress" aria-label="Round progress"></progress>
          <span id="count"></span>
        </div>
        <h2 id="prompt" tabindex="-1"></h2>
        <div id="map-question" hidden>
          <div class="map-shell">
            <svg id="map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Country map"></svg>
            <div id="map-controls" class="map-controls" role="group" aria-label="Map controls" hidden>
              <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
              <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
              <button id="reset-map" type="button" aria-label="Reset map view">⟲</button>
            </div>
            <p id="map-loading" role="status" hidden>Loading map…</p>
          </div>
          <p class="map-hint">Drag to move the map. Pinch or use + and − to zoom.</p>
        </div>
        <div id="flag-question" class="flag-panel" hidden>
          <div class="flag-art" id="flag" role="img" aria-label="Flag to identify" tabindex="-1"></div>
        </div>
        <div id="answers" class="answers" aria-label="Answer choices" hidden></div>
        <p id="feedback" class="feedback" role="status"></p>
        <button id="retry-map" class="primary" type="button" hidden>Retry map</button>
        <button id="next" class="primary" type="button" hidden>Next question</button>
      </section>
      <section id="results" class="panel results" aria-labelledby="results-title" hidden>
        <div class="result-icon" aria-hidden="true">✓</div>
        <h1 id="results-title" tabindex="-1">Quiz complete</h1>
        <p id="result-score"></p>
        <p id="result-round"></p>
        <button id="again" class="primary" type="button">Play again</button>
        <button id="back" class="secondary" type="button">Choose a quiz</button>
      </section>
    </main>
  </div>
  <script type="module" src="./game.mjs?v=6"></script>
</body>
</html>
